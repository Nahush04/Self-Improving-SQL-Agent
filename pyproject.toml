[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-sql-agent"
version = "0.1.0"
description = "A text-to-SQL agent that improves over time by reading from an external memory served over MCP"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "mcp[cli]>=1.2",
    "sqlite-vec>=0.1",
    "sentence-transformers>=3",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
sqlagent-baseline = "sqlagent.run_baseline:main"
sqlagent-memory = "sqlagent.memory.server:main"
sqlagent-with-memory = "sqlagent.run_with_memory:main"
sqlagent-train = "sqlagent.run_train:main"
sqlagent-experiment = "sqlagent.run_experiment:main"
sqlagent-report = "sqlagent.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
